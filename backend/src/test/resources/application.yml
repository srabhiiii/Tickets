spring:
  application:
    name: reconx
  profiles:
    active: test
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true
  datasource:
    url: jdbc:h2:mem:reconx_test;DB_CLOSE_DELAY=0;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC

  cache:
    cache-names: instruments,counterparties
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

server:
  port: 8081
  servlet:
    context-path: /api

reconx:
  security:
    jwt:
      secret: dev-secret-change-me-32-bytes-min!!
      expiration-minutes: 60
      refresh-expiration-days: 7
      issuer: reconx
